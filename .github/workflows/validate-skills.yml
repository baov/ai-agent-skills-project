name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: Agent Skills specification conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # The script has no dependencies: no install step.
      - name: Rules applied
        run: python3 tools/validate-skills.py --explain
      # Exit 1 = an `error` violation, blocking. Exit 2 = `warn` only, reported
      # without blocking: the harness informs, it does not put up a gate.
      - name: Validation
        run: |
          python3 tools/validate-skills.py --root . || status=$?
          if [ "${status:-0}" = "2" ]; then
            echo "::warning::Some spec recommendations are not met (see above)."
            exit 0
          fi
          exit "${status:-0}"

  language:
    name: English, and on-glossary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Glossary check
        run: tools/check-glossary.sh
